<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Complemento de Pago - HSC</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  (()=>{
    const saved = localStorage.getItem('hsc-theme');
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
<style>
  :root{--bg:#fff;--card:#f9fafb;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#374151;--ok:#22c55e;--danger:#ef4444}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Roboto,system-ui,-apple-system,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .title{font-size:1.25rem;font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 20px rgba(17,24,39,.05);margin-bottom:14px}
  label{display:block;font-size:.9rem;color:var(--muted);margin:8px 0 6px}
  input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff;outline:none}
  .row{display:grid;gap:12px} @media(min-width:720px){.row-2{grid-template-columns:1fr 1fr}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:15px;background:#f9f9f9;color:#0f172a;text-decoration:none}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .btn:hover{background:#f3f4f6} .btn-primary{background:var(--brand);color:#fff;border-color:transparent}
  .btn-ok{background:var(--ok);color:#fff;border-color:transparent}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;white-space:pre-wrap}
  .flash{display:none;margin:12px 0;padding:10px 12px;border-radius:12px;font-weight:600}
  .ok{display:block;background:#dcfce7;border:1px solid #bbf7d0;color:#14532d}
  .err{display:block;background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d}
  .pill{font-size:.85rem;color:var(--muted)}
  .spin{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  :root{--bg:#f4f7fb;--surface:#fff;--card:#fff;--ink:#17233b;--muted:#64748b;--line:#dce3ed;--brand:#2563eb;--soft:#f8fafc;--ok:#16a34a;--danger:#ef4444;--shadow:0 12px 32px rgba(30,41,59,.08)}
  html[data-theme="dark"]{--bg:#0b1120;--surface:#121b2e;--card:#151f33;--ink:#f8fafc;--muted:#9fb0c9;--line:#30405a;--brand:#3b82f6;--soft:#1c2940;--ok:#22c55e;--shadow:0 16px 38px rgba(0,0,0,.24)}
  html,body{background:var(--bg);color:var(--ink)}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:1120px;padding:14px 18px}
  .top{gap:16px;margin-bottom:16px}
  .title{font-size:1.55rem;font-weight:900;letter-spacing:-.025em}
  .card{background:var(--card);border-color:var(--line);border-radius:16px;box-shadow:var(--shadow);padding:13px;margin-bottom:10px}
  label{font-size:.78rem;font-weight:800;color:var(--muted)}
  input,select{padding:10px 11px;background:var(--surface);color:var(--ink)}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  input:disabled{background:var(--soft);color:var(--muted)}
  input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
  .btn{padding:9px 11px;background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn:hover{background:var(--soft)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-ok{background:var(--ok);color:#fff}
  .pill{color:var(--muted)}
  .theme-toggle{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:750;cursor:pointer}
  .theme-track{width:38px;height:21px;padding:2px;border-radius:999px;background:#94a3b8;transition:.2s;display:flex}
  .theme-knob{width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
  html[data-theme="dark"] .theme-track{background:#22c55e}
  html[data-theme="dark"] .theme-knob{transform:translateX(17px)}
  .theme-text{font-size:.76rem;white-space:nowrap}
  .section-title{margin:0 0 8px}
  .balance-note{margin-top:8px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));border-radius:11px;background:var(--soft);color:var(--muted);font-size:.82rem}
  .balance-note strong{color:var(--ink)}
  @media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.top .actions{width:100%}.top .actions .btn{flex:1}.wrap{padding:12px}.card{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">Complemento de pago</div>
      <div class="pill">Genera REP para facturas PPD</div>
    </div>
    <div class="actions">
      <a class="btn" href="/inicio-app">🏠 Inicio</a>
      <a class="btn" href="/facturacion">🧾 Facturas</a>
      <a class="btn" href="/cotizaciones">📋 Cotizaciones</a>
      <a class="btn" href="/cerrar-sesion">🔒 Salir</a>
      <button class="theme-toggle" type="button" id="theme-toggle" role="switch" aria-label="Cambiar modo de color">
        <span class="theme-track" aria-hidden="true"><span class="theme-knob"></span></span>
        <span class="theme-text" id="theme-label">Modo</span>
      </button>
    </div>
  </div>

  <div id="msg" class="flash"></div>

  <div class="card">
    <div class="row row-2">
      <div>
        <label>Folio fiscal (UUID)</label>
        <input id="ref" placeholder="Pega el UUID de la factura" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="btnBuscar" class="btn">🔎 Buscar factura</button>
      </div>
    </div>
    <div id="invBox" style="display:none;margin-top:12px">
      <div class="row row-2">
        <div><label>Receptor</label><input id="invReceptor" disabled /></div>
        <div><label>RFC</label><input id="invRFC" disabled /></div>
      </div>
      <div class="row row-2">
        <div><label>Método</label><input id="invMetodo" disabled /></div>
        <div><label>Total</label><input id="invTotal" disabled /></div>
      </div>
      <div class="row">
        <div><label>Folio fiscal (UUID)</label><input id="invUUID" disabled /></div>
      </div>
      <div class="row row-2">
        <div><label>Régimen fiscal</label><input id="invRegimen" placeholder="Ej. 601" /></div>
        <div><label>Código postal fiscal</label><input id="invCP" placeholder="5 dígitos" /></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row row-2">
      <div>
        <label>Importe a pagar</label>
        <input id="amount" type="number" step="0.01" min="0" placeholder="Ej. 1000.00" />
      </div>
      <div>
        <label>Forma de pago</label>
        <select id="payment_form">
          <option value="01">01 - Efectivo</option>
          <option value="02">02 - Cheque nominativo</option>
          <option value="03" selected>03 - Transferencia electrónica de fondos</option>
          <option value="04">04 - Tarjeta de crédito</option>
          <option value="05">05 - Monedero electrónico</option>
          <option value="06">06 - Dinero electrónico</option>
          <option value="08">08 - Vales de despensa</option>
          <option value="12">12 - Dación en pago</option>
          <option value="13">13 - Pago por subrogación</option>
          <option value="14">14 - Pago por consignación</option>
          <option value="15">15 - Condonación</option>
          <option value="17">17 - Compensación</option>
          <option value="23">23 - Novación</option>
          <option value="24">24 - Confusión</option>
          <option value="25">25 - Remisión de deuda</option>
          <option value="26">26 - Prescripción o caducidad</option>
          <option value="27">27 - A satisfacción del acreedor</option>
          <option value="28">28 - Tarjeta de débito</option>
          <option value="29">29 - Tarjeta de servicios</option>
          <option value="30">30 - Aplicación de anticipos</option>
          <option value="31">31 - Intermediario de pagos</option>
        </select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>Saldo anterior</label>
        <input id="previous_balance" type="number" step="0.01" min="0.01" readonly />
      </div>
      <div>
        <label>Número de parcialidad</label>
        <input id="partiality_number" type="number" step="1" min="1" value="1" readonly />
      </div>
    </div>
    <div id="balanceNote" class="balance-note" style="display:none"></div>
    <div class="row row-2">
      <div>
        <label>Fecha de pago (opcional)</label>
        <input id="pay_date" type="datetime-local" />
      </div>
      <div>
        <label>Referencia (opcional)</label>
        <input id="reference" placeholder="No. operación, nota, etc." />
      </div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button id="btnCrear" class="btn btn-ok" type="button" disabled>💳 Crear complemento</button>
      <a id="lnkVerPDF" class="btn" style="display:none" target="_blank">📄 Ver REP PDF</a>
      <a id="lnkVerXML" class="btn" style="display:none" target="_blank">🧩 Ver REP XML</a>
    </div>
  </div>

  <div class="card" id="responseCard" style="display:none">
    <h3 class="section-title">Respuesta</h3>
    <pre id="out" class="mono"></pre>
  </div>
</div>

<script>
const msg = (ok,t) => { const el=document.getElementById('msg'); el.className='flash '+(ok?'ok':'err'); el.textContent=t; };
const errorText = value => {
  if(!value) return 'No se pudo completar la operación. Intenta nuevamente.';
  if(typeof value === 'string') return value;
  if(value.message || value.Message) return value.message || value.Message;
  if(value.error) return errorText(value.error);
  if(value.ModelState) return Object.values(value.ModelState).flat().join(' ');
  return 'El servicio fiscal rechazó la operación. Revisa los datos e intenta nuevamente.';
};
const $ = id => document.getElementById(id);
let cachedInvoice = null;
let lock = false; // antirrebote
const themeToggle = $('theme-toggle');
const themeLabel = $('theme-label');
function syncThemeToggle(){
  const dark = document.documentElement.dataset.theme === 'dark';
  themeToggle.setAttribute('aria-checked', String(dark));
  themeLabel.textContent = dark ? 'Oscuro' : 'Claro';
}
themeToggle.onclick = ()=>{
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('hsc-theme', next);
  syncThemeToggle();
};
syncThemeToggle();

$('btnBuscar').onclick = async () => {
  if(lock) return;
  msg(true,'Buscando…'); $('invBox').style.display='none'; $('btnCrear').disabled = true;
  $('out').textContent = ''; $('lnkVerPDF').style.display='none'; $('lnkVerXML').style.display='none';
  const ref = $('ref').value.trim();
  if(!ref){ msg(false,'Ingresa UUID o invoice_id'); return; }

  try{
    lock = true;
    let invoice_id = ref;
    if(ref.includes('-')){ // UUID
      const rs = await fetch(`/api/pagos/resolve?uuid=${encodeURIComponent(ref)}`);
      const d = await rs.json();
      if(!rs.ok) throw new Error(errorText(d.error || 'UUID no encontrado'));
      invoice_id = d.id;
    }
    const ri = await fetch(`/api/pagos/info/${invoice_id}`);
    const inv = await ri.json();
    if(!ri.ok) throw new Error(errorText(inv.error || 'Factura no encontrada'));

    cachedInvoice = inv;
    $('invReceptor').value = inv.customer?.legal_name || '';
    $('invRFC').value = inv.customer?.tax_id || '';
    $('invMetodo').value = inv.payment_method || '';
    $('invTotal').value = inv.total?.toFixed ? inv.total.toFixed(2) : inv.total;
    $('invUUID').value = inv.uuid || '';
    $('invRegimen').value = inv.customer?.tax_system || '';
    $('invCP').value = inv.customer?.zip || '';
    $('invBox').style.display='block';
    msg(true,'Factura encontrada');

    $('amount').value = inv.remaining_balance || '';
    $('amount').max = inv.remaining_balance || '';
    $('previous_balance').value = inv.remaining_balance || inv.total || '';
    $('partiality_number').value = inv.next_partiality_number || 1;
    const note = $('balanceNote');
    note.style.display='block';
    note.innerHTML = `<strong>${inv.payment_count||0} pago(s) registrado(s).</strong> Pagado: $${Number(inv.paid_amount||0).toLocaleString('es-MX',{minimumFractionDigits:2})} · Saldo: $${Number(inv.remaining_balance||0).toLocaleString('es-MX',{minimumFractionDigits:2})}.`;
    $('btnCrear').disabled = (inv.payment_method !== 'PPD' || inv.paid);
    if(inv.payment_method !== 'PPD') msg(false,'Esta factura es PUE y no requiere complemento de pago.');
    else if(inv.paid) msg(false,'Esta factura ya está totalmente pagada.');
  }catch(e){
    msg(false,e.message);
  }finally{
    lock = false;
  }
};

$('btnCrear').onclick = async () => {
  if(lock) return;
  if(!cachedInvoice){ msg(false,'Primero busca la factura'); return; }
  const body = {
    invoice_id: cachedInvoice.id,
    payment_form: $('payment_form').value,
    amount: parseFloat($('amount').value||0),
    tax_system: $('invRegimen').value.trim(),
    tax_zip: $('invCP').value.trim()
  };
  const dt = $('pay_date').value.trim(); if(dt) body.date = dt;
  const rf = $('reference').value.trim(); if(rf) body.reference = rf;

  // antirrebote UI
  const btn = $('btnCrear');
  $('amount').classList.remove('invalid');
  const oldHtml = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Timbrando…';
  msg(true,'Creando complemento…'); $('lnkVerPDF').style.display='none'; $('lnkVerXML').style.display='none';

  try{
    lock = true;
    const r = await fetch('/api/pagos/crear', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await r.json();
    if(r.ok && data.ok){
      const drive = data.warning ? 'fail' : 'ok';
      location.href = `/facturacion?complemento=1&drive=${drive}&parcialidad=${encodeURIComponent(data.partiality_number||'')}`;
    }else{
      msg(false, errorText(data.error));
      if(data.field && $(data.field)){$(data.field).classList.add('invalid');$(data.field).focus();}
      btn.disabled = false; // solo reactivar si falló
    }
  }catch(e){
    msg(false,e.message);
    btn.disabled = false;
  }finally{
    btn.innerHTML = oldHtml;
    lock = false;
  }
};

// precarga por querystring
(function preload(){
  const qs = new URLSearchParams(location.search);
  const id = qs.get('invoice_id'); const u = qs.get('uuid');
  if(id || u){ $('ref').value = u || id; $('btnBuscar').click(); }
})();
</script>
</body>
</html>
