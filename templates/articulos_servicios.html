<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artículos y servicios · HSC</title>
  <style>
    :root{--bg:#081121;--card:#131d2f;--field:#1d2940;--ink:#f8fafc;--muted:#adc0df;--line:#33425d;--brand:#347bf6;--ok:#20c66a;--danger:#f34b50}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,system-ui,sans-serif}.wrap{max-width:1220px;margin:auto;padding:24px}.top,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:18px}h1{margin:0;font-size:28px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.wide{grid-column:span 2}label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 5px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--field);color:var(--ink);font-size:15px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--field);color:var(--ink);font-weight:750;text-decoration:none;cursor:pointer}.primary{background:var(--brand);border-color:transparent}.danger{background:var(--danger);border-color:transparent}.table{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}th{position:sticky;top:0;background:#1a263a}.badge{padding:4px 8px;border-radius:999px;background:#174b35;color:#91f5bc}.off{background:#50262b;color:#ffb8bb}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:12px}.msg.show{display:block}.msg.ok{background:#153d2b}.msg.err{background:#4d252a}@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='hsc_theme.css') }}">
  <script src="{{ url_for('static', filename='hsc_theme.js') }}"></script>
  <script defer src="{{ url_for('static', filename='hsc_inputs.js') }}"></script>
</head>
<body><main class="wrap">
  <div class="top"><div><h1>Artículos y servicios</h1><div class="muted">Tu catálogo rápido para facturación</div></div><div class="actions"><a class="btn" href="/facturacion">← Facturas</a><a class="btn primary" href="/facturas/nueva">Nueva factura</a></div></div>
  <div id="msg" class="msg"></div>
  <section class="card"><h2 id="formTitle">Nuevo artículo o servicio</h2><div class="grid">
    <div><label>Código interno</label><input id="codigo" maxlength="50" placeholder="SERV-MANT-01"></div>
    <div><label>Nombre</label><input id="nombre" maxlength="80" placeholder="Mantenimiento preventivo"></div>
    <div class="wide"><label>Descripción para factura</label><input id="descripcion" placeholder="Servicio de mantenimiento preventivo..."></div>
    <div><label>Categoría</label><input id="categoria" placeholder="Refrigeración"></div>
    <div><label>Clave SAT</label><input id="clave" inputmode="numeric" maxlength="8" placeholder="72151200"></div>
    <div><label>Unidad SAT</label><select id="unidad"><option value="E48">E48 · Servicio</option><option value="H87">H87 · Pieza</option><option value="MTR">MTR · Metro</option><option value="KGM">KGM · Kilogramo</option><option value="LTR">LTR · Litro</option></select></div>
    <div><label>Precio sin IVA</label><input id="precio" type="number" min="0" step="0.01" value="0"></div>
    <div><label>IVA</label><select id="iva"><option value="0.16">16%</option><option value="0.08">8%</option><option value="0">0%</option></select></div>
    <div><label>Estado</label><select id="activo"><option value="true">Activo</option><option value="false">Inactivo</option></select></div>
  </div><div class="actions" style="margin-top:14px"><button id="guardar" class="btn primary">Guardar</button><button id="cancelar" class="btn" hidden>Cancelar edición</button></div></section>
  <section class="card"><div class="top"><div><h2 style="margin:0">Catálogo</h2><span id="conteo" class="muted"></span></div><input id="buscar" style="max-width:430px" placeholder="Buscar por código, nombre, categoría o clave SAT..."></div>
    <div class="table"><table><thead><tr><th>Código</th><th>Nombre / descripción</th><th>Categoría</th><th>Clave SAT</th><th>Unidad</th><th>Precio</th><th>IVA</th><th>Estado</th><th></th></tr></thead><tbody id="body"></tbody></table></div>
  </section>
</main><script>
let items=[], editing=''; const $=id=>document.getElementById(id); const money=n=>Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'}); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(ok,text){$('msg').className='msg show '+(ok?'ok':'err');$('msg').textContent=text}
async function load(){const r=await fetch('/api/articulos?todos=1');const d=await r.json();if(!r.ok||!d.ok){message(false,d.error||'No se pudo cargar el catálogo');return}items=d.items||[];render()}
function render(){const q=$('buscar').value.trim().toLowerCase();const shown=items.filter(x=>[x.codigo,x.nombre,x.descripcion,x.categoria,x.clave_sat].join(' ').toLowerCase().includes(q));$('conteo').textContent=`${shown.length} registros`;$('body').innerHTML=shown.map(x=>`<tr><td><b>${esc(x.codigo)}</b></td><td><b>${esc(x.nombre)}</b><div class="muted">${esc(x.descripcion)}</div></td><td>${esc(x.categoria)}</td><td>${esc(x.clave_sat)}</td><td>${esc(x.unidad_sat)}</td><td>${money(x.precio)}</td><td>${Math.round(Number(x.iva)*100)}%</td><td><span class="badge ${x.activo?'':'off'}">${x.activo?'Activo':'Inactivo'}</span></td><td><button class="btn" data-edit="${esc(x.codigo)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">No hay coincidencias.</td></tr>';$('body').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function values(){return{codigo:$('codigo').value,nombre:$('nombre').value,descripcion:$('descripcion').value,categoria:$('categoria').value,clave_sat:$('clave').value,unidad_sat:$('unidad').value,precio:$('precio').value,iva:$('iva').value,activo:$('activo').value==='true'}}
function clear(){editing='';$('formTitle').textContent='Nuevo artículo o servicio';['codigo','nombre','descripcion','categoria','clave'].forEach(id=>$(id).value='');$('precio').value=0;$('iva').value='0.16';$('activo').value='true';$('codigo').disabled=false;$('cancelar').hidden=true}
function edit(code){const x=items.find(i=>i.codigo===code);if(!x)return;editing=code;$('formTitle').textContent='Editar '+code;$('codigo').value=x.codigo;$('codigo').disabled=true;$('nombre').value=x.nombre;$('descripcion').value=x.descripcion;$('categoria').value=x.categoria;$('clave').value=x.clave_sat;$('unidad').value=x.unidad_sat;$('precio').value=x.precio;$('iva').value=String(x.iva);$('activo').value=String(x.activo);$('cancelar').hidden=false;scrollTo({top:0,behavior:'smooth'})}
$('guardar').onclick=async()=>{const method=editing?'PUT':'POST',url=editing?'/api/articulos/'+encodeURIComponent(editing):'/api/articulos';$('guardar').disabled=true;try{const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(values())});const d=await r.json();if(!r.ok||!d.ok){message(false,d.error||'No se pudo guardar');return}message(true,editing?'Artículo actualizado.':'Artículo agregado.');clear();await load()}catch(e){message(false,e.message)}finally{$('guardar').disabled=false}};$('cancelar').onclick=clear;$('buscar').oninput=render;load();
</script></body></html>
