<div class="modal" id="worklistEditor"><div class="sheet">
  <h2>Organizar mi jornada</h2>
  <form id="worklistForm">
    <div class="field"><label for="worklistName">Nombre de la lista</label><input id="worklistName" maxlength="120" required placeholder="Arkansas · cocina"></div>
    <div class="field-row"><div class="field"><label for="worklistDate">Fecha prevista</label><input id="worklistDate" type="date" required></div><div class="field" id="worklistAssigneeField"><label for="worklistAssignee">Responsable</label><select id="worklistAssignee"></select></div></div>
    <div class="field-row"><div class="field"><label for="worklistClient">Cliente</label><select id="worklistClient" required></select></div><div class="field"><label for="worklistRound">Ronda de los equipos que agregues</label><select id="worklistRound"><option value="1">R1</option><option value="2">R2</option><option value="3">R3</option><option value="4">R4</option></select></div></div>
    <details id="worklistSharing"><summary>Compartir lista con <span id="worklistSharingCount">· Sólo para mí</span></summary><p class="editor-note">Opcional. Los técnicos seleccionados verán y podrán organizar la misma lista. El responsable administra los colaboradores.</p><div id="worklistCollaborators" class="work-scroll"></div><p id="worklistSharingStatus" role="status"></p></details>
    <h3 id="worklistSelectedCount">Tu orden de trabajo</h3><div id="worklistSelected" class="work-scroll"></div>
    <div class="field"><label for="worklistSearch">Buscar equipos para agregar</label><input id="worklistSearch" type="search" placeholder="Clave o nombre del equipo"></div>
    <div class="filters" id="worklistEquipmentFilters"><button type="button" class="chip active" data-work-filter="all" aria-pressed="true">Todos</button><button type="button" class="chip" data-work-filter="done" aria-pressed="false">Realizados</button><button type="button" class="chip" data-work-filter="pending" aria-pressed="false">Pendientes</button></div>
    <div id="worklistChoices" class="work-scroll"></div>
    <p id="worklistEditorError" role="alert"></p>
    <div class="work-actions"><button id="closeWorklistEditor" class="secondary" type="button">Cancelar</button><button id="saveWorklist" class="primary" type="submit">Guardar lista</button></div>
  </form>
</div></div>
<style>
.work-actions,.work-order{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.work-selected{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line)}.work-selected>.card-copy{flex:1;min-width:0;overflow-wrap:anywhere}.work-selected small,#worklistItems small{display:block;color:var(--muted);margin-top:4px}.work-order{flex-shrink:0}.work-order button{min-width:44px;min-height:44px}.work-scroll{max-height:280px;overflow:auto;overscroll-behavior:contain}.work-choice{display:block;width:100%;text-align:left;margin:6px 0;white-space:normal;overflow-wrap:anywhere}#worklistEditor .sheet{max-height:90dvh;overflow:auto}#worklistEditorError{color:var(--danger)}#worklistCards b,#worklistItems b{white-space:normal;overflow-wrap:anywhere}#worklistCards .card-copy{min-width:0;flex:1}#worklistCards small{display:block}#worklistTomorrow,#worklistEdit,#worklistClose,#worklistDelete{white-space:normal}
</style>
<style>
.work-selected .status-dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle}.work-selected .card-copy{font-size:.85rem}
@media(max-width:450px){.work-selected{display:grid;grid-template-columns:42px minmax(0,1fr)}.work-selected .equipment-photo{width:42px;height:48px;grid-column:1;grid-row:1}.work-selected .card-copy{grid-column:2}.work-selected .work-order{grid-column:2;justify-content:flex-end;margin:2px 0}.work-selected .work-order button{min-width:42px;min-height:42px}}
</style>
<style>
#worklistSharing{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:14px}#worklistSharing summary{cursor:pointer;font-weight:700;min-height:32px}#worklistSharingCount{font-size:.8rem;color:var(--muted)}#worklistCollaborators label{display:flex;align-items:center;gap:10px;min-height:44px}#worklistSharingStatus{color:var(--muted);font-size:.8rem}
#worklistChoices .work-choice{display:flex;align-items:center;gap:10px;padding:10px;margin:7px 0}#worklistChoices .equipment-photo,.work-selected .equipment-photo{width:48px;height:52px;flex:none;border-radius:10px;position:relative;overflow:hidden}#worklistChoices .card-copy{flex:1;min-width:0}#worklistChoices small{display:block;color:var(--muted);margin-top:4px;font-size:.75rem}#worklistChoices b{font-size:.86rem}#worklistChoices .status-dot{flex:none}.work-selected .work-order{gap:3px}.work-selected .work-order button{min-width:36px;min-height:40px}#worklistEquipmentFilters{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
</style>
