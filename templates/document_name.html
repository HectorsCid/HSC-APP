<dialog id="documentNameDialog" aria-labelledby="documentNameTitle" style="width:min(26rem,88vw);border:1px solid #8192a5;border-radius:16px;padding:20px;background:var(--card,Canvas);color:var(--ink,CanvasText)">
  <form method="dialog" style="display:grid;gap:12px">
    <label id="documentNameTitle" for="documentNameValue"></label>
    <input id="documentNameValue" maxlength="100" placeholder="Ej. Cambio de compresor" autofocus>
    <button class="btn btn-primary" value="named">Usar nombre</button>
    <button class="btn" value="unnamed">Continuar sin nombre</button>
    <button class="btn" value="cancel">Cancelar</button>
  </form>
</dialog>
<script>
window.askDocumentName = (title, previous='') => new Promise(resolve=>{
  const d=document.getElementById('documentNameDialog'), input=document.getElementById('documentNameValue');
  if(d.open){resolve(null);return;}
  d.querySelector('label').textContent=title;
  input.value=previous.slice(0,100); input.setCustomValidity('');
  input.oninput=()=>input.setCustomValidity('');
  d.querySelector('form').onsubmit=e=>{
    e.stopPropagation();
    if(e.submitter?.value==='named' && !input.value.trim()){
      e.preventDefault();input.setCustomValidity('Escribe un nombre o elige continuar sin nombre.');input.reportValidity();input.setCustomValidity('');
    }
  };
  d.returnValue='cancel';
  d.addEventListener('close',()=>resolve(d.returnValue==='named'?input.value.trim():d.returnValue==='unnamed'?'':null),{once:true});
  d.showModal();input.select();
});
</script>
