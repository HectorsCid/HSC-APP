services:
  - type: web
    name: hsc-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: REPORTES_AUTO_PDF
        value: "1"
      - key: REPORTES_AUTO_PDF_INTERVAL
        value: "60"
      - key: REPORTES_AUTO_PDF_STABILITY_SECONDS
        value: "120"
      - key: FLASK_SECRET_KEY
        generateValue: true
